name: run-all-tests

on:
  workflow_dispatch:

  pull_request:
    types: [opened, reopened, ready_for_review]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python ${{ matrix.python-version }}
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Spark downloads its packages from Maven Central at session start, which rate-limits shared runner IPs.
      - name: Cache Spark packages
        uses: actions/cache@v4
        with:
          path: /tmp/.ivy2.5.2
          key: spark-ivy-${{ hashFiles('src/teehr/evaluation/spark_session_utils.py') }}
          restore-keys: spark-ivy-

      - name: Install Poetry
        run: pip install poetry

      - name: Install Dependencies
        run: poetry install --no-interaction --no-root

      - name: Run tests
        run: poetry run nox -s all_tests