[project]
name = "teehr"
version = "1.0.0.dev0"
description = "TEEHR: the Python SDK and CLI for TEEHR Cloud."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "RTI International" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Hydrology",
]
# Light on purpose (ADR-0015): no Spark, DuckDB or teehr-core. Local evaluation
# and the fetch package come later as extras (e.g. teehr[local], teehr[fetch]).
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6",
    "typer>=0.12",
]

[project.scripts]
teehr = "teehr.cli:run"

[project.urls]
Repository = "https://github.com/RTIInternational/teehr"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "types-pyyaml>=6",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teehr"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "D"]
# B008: typer declares options as call defaults.
ignore = ["D105", "D107", "B008"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers"]
